name: Daily Grant Update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write
  actions: read

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          python ni_estate_grant_monitor.py

      - name: Commit updated CSV files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add colebrooke_grant_matches.csv grant_review_pages.csv
          git commit -m "Daily grant update" || echo "No changes to commit"
          git push origin HEAD:main
