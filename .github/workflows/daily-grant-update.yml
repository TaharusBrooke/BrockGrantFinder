name: Daily Grant Update

on:
  schedule:
    - cron: '17 6 * * *'  # Runs daily at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python ni_estate_grant_monitor.py

      - name: Commit updated CSV
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add colebrooke_grant_matches.csv
          git commit -m "Daily grant update" || echo "No changes"
          git push
